<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge — Let's get started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Outfit:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">PromptForge</div>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="marquee-wrap" aria-hidden="true">
    <div class="marquee-track">
      <span>MADE BY UROOSA KHAN</span>
      <span>MADE BY UROOSA KHAN</span>
      <span>MADE BY UROOSA KHAN</span>
      <span>MADE BY UROOSA KHAN</span>
    </div>
  </div>

  <main class="generate-main">
    <div class="generate-inner">

      <h1 class="generate-heading">Let's get started<span class="blink-cursor" aria-hidden="true"></span></h1>

      <form class="search-row" id="prompt-form">
        <div class="search-field">
          <input
            type="text"
            id="prompt-input"
            class="prompt-search-input"
            autocomplete="off"
            aria-label="Describe what you want, however scuffed"
          >
          <span class="fake-placeholder" id="fake-placeholder">write here</span>
        </div>
        <button type="submit" class="search-btn" id="search-btn" aria-label="Generate prompts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>

      <div class="results" id="results"></div>
      <p class="empty-hint" id="empty-hint">Type your rough idea above and hit search you'll get several ready-to-use prompt versions.</p>

    </div>
  </main>

 
  <script src="script.js"></script>
</body>
</html>
